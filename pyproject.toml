[project]
name = "chiron"
version = "0.1.0"
description = "Mount any git repo as a corpus and study it with your agent: layered notes, curated schematics, a shared vocabulary."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "mcp>=1.30.0",
    "numpy>=2.5.3",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]
