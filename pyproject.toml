[project]
name = "chiron"
version = "0.1.0"
description = "Mount any git repo as a corpus and extract its linguistic structure: the lexicon, phrasebook, and concept relations you need to prompt agents in the corpus's own terms."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
